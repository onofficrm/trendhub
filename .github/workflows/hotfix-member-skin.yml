name: Hotfix member skin

# 회원 로그인/플랫폼 스킨 의존 파일 FTP 업로드 (전체 배포 대체용)
on:
  workflow_dispatch:

jobs:
  upload-member-skins:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload member skins and platform deps
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          missing=0
          [ -z "${FTP_SERVER:-}" ] && echo "::error::FTP_SERVER missing" && missing=1
          [ -z "${FTP_USERNAME:-}" ] && echo "::error::FTP_USERNAME missing" && missing=1
          [ -z "${FTP_PASSWORD:-}" ] && echo "::error::FTP_PASSWORD missing" && missing=1
          [ -z "${FTP_PORT:-}" ] && echo "::error::FTP_PORT missing" && missing=1
          [ "$missing" -eq 1 ] && exit 1

          upload_tree() {
            local local_root="$1"
            local remote_rel="$2"
            find "$local_root" -type f ! -name '._*' ! -name '.DS_Store' | while read -r f; do
              rel="${f#"$local_root"/}"
              url="ftp://${FTP_SERVER}:${FTP_PORT}/public_html/${remote_rel}/${rel}"
              echo "PUT ${remote_rel}/${rel}"
              curl --fail --silent --show-error --ftp-create-dirs \
                --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
                -T "$f" \
                "$url"
            done
          }

          upload_file() {
            local local_file="$1"
            local remote_rel="$2"
            test -f "$local_file"
            echo "PUT ${remote_rel}"
            curl --fail --silent --show-error --ftp-create-dirs \
              --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
              -T "$local_file" \
              "ftp://${FTP_SERVER}:${FTP_PORT}/public_html/${remote_rel}"
          }

          test -f skin/member/basic/login.skin.php
          test -f skin/member/onoff/login.skin.php
          test -f skin/_inc/onoff-platform.php
          test -f css/onoff-platform.css

          upload_tree "skin/member/basic" "skin/member/basic"
          upload_tree "skin/member/onoff" "skin/member/onoff"
          upload_tree "mobile/skin/member/basic" "mobile/skin/member/basic"
          upload_tree "mobile/skin/member/onoff" "mobile/skin/member/onoff"
          upload_tree "skin/_inc" "skin/_inc"
          upload_tree "img/brand" "img/brand"

          upload_file "css/onoff-platform.css" "css/onoff-platform.css"
          upload_file "lib/onoff-platform-skin.lib.php" "lib/onoff-platform-skin.lib.php"
          upload_file "extend/onoff-platform-skin.extend.php" "extend/onoff-platform-skin.extend.php"
          upload_file "_site.config.php" "_site.config.php"

          echo "=== verify remote listing ==="
          for path in \
            skin/member/basic \
            skin/member/onoff \
            skin/_inc \
            css \
            img/brand
          do
            echo "--- ${path} ---"
            curl --silent --show-error --list-only \
              --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
              "ftp://${FTP_SERVER}:${FTP_PORT}/public_html/${path}/" | head -40 || true
          done

          echo "Hotfix member skin upload done."
