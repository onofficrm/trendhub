name: Deploy independent domain hotfix

# onoffcpa 독립 도메인·썸네일 UI 핫픽스 (전체 FTP 타임아웃 회피)
on:
  push:
    branches:
      - main
    paths:
      - 'extend/linkconnect-spa.extend.php'
      - 'plugin/linkconnect/inc/link.php'
      - 'plugin/linkconnect/inc/landing.php'
      - 'plugin/linkconnect/inc/campaign_dasibom.php'
      - 'plugin/linkconnect/inc/campaign_modemo.php'
      - 'plugin/linkconnect/inc/campaign_hasugu_cpa.php'
      - 'plugin/onoff-builder-bridge/imports/dasibom/**'
      - 'plugin/onoff-builder-bridge/imports/banktupt/**'
      - '.github/workflows/deploy-independent-domain.yml'
  workflow_dispatch:

jobs:
  deploy-independent-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare hotfix bundle
        run: |
          ROOT=".deploy/independent-domain"
          rm -rf "$ROOT"
          FILES=(
            "extend/linkconnect-spa.extend.php"
            "plugin/linkconnect/inc/link.php"
            "plugin/linkconnect/inc/landing.php"
            "plugin/linkconnect/inc/campaign.php"
            "plugin/linkconnect/inc/campaign_dasibom.php"
            "plugin/linkconnect/inc/campaign_modemo.php"
            "plugin/linkconnect/inc/campaign_hasugu_cpa.php"
            "plugin/linkconnect/admin/api/campaigns.php"
            "plugin/linkconnect/api/domain_gate_probe.php"
            "plugin/linkconnect/api/landing_context.php"
          )
          for file in "${FILES[@]}"; do
            mkdir -p "$ROOT/$(dirname "$file")"
            cp "$file" "$ROOT/$file"
          done
          for id in dasibom banktupt; do
            mkdir -p "$ROOT/plugin/onoff-builder-bridge/imports/$id"
            rsync -a --delete --exclude '._*' --exclude '.DS_Store' --exclude '*.map' \
              "plugin/onoff-builder-bridge/imports/$id/" \
              "$ROOT/plugin/onoff-builder-bridge/imports/$id/"
            test -f "$ROOT/plugin/onoff-builder-bridge/imports/$id/index.html"
          done
          find "$ROOT" -name '._*' -delete 2>/dev/null || true
          test -f "$ROOT/extend/linkconnect-spa.extend.php"
          test -f "$ROOT/plugin/linkconnect/inc/landing.php"
          echo "Bundle files: $(find "$ROOT" -type f | wc -l)"

      - name: FTP upload hotfix bundle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          parallel: 1
          protocol: ftp
          local-dir: .deploy/independent-domain/
          server-dir: /public_html/
          state-name: onoffcpa-independent-domain-v2
          log-level: minimal
          timeout: 600000
