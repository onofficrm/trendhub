name: Deploy advertiser notify hotfix

# 광고주 DB 메일 알림 + 설정 UI 핫픽스
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'plugin/linkconnect/inc/email_notify.php'
      - 'plugin/linkconnect/merchant/api/notification_prefs.php'
      - 'plugin/onoff-builder-bridge/imports/linkconnect/**'
      - 'builder/linkconnect_source/src/pages/advertiser/AdvertiserSettings.tsx'
      - 'builder/linkconnect_source/src/pages/About.tsx'
      - 'builder/linkconnect_source/src/components/Header.tsx'
      - 'builder/linkconnect_source/src/layouts/AdvertiserLayout.tsx'
      - 'builder/linkconnect_source/src/App.tsx'
      - 'builder/linkconnect_source/src/lib/api.ts'
      - 'builder/linkconnect_source/src/lib/publicNav.ts'
      - '.github/workflows/deploy-advertiser-notify-hotfix.yml'

concurrency:
  group: onoffcpa-advertiser-notify-hotfix
  cancel-in-progress: true

jobs:
  deploy-advertiser-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare notify hotfix bundle
        run: |
          ROOT=".deploy/advertiser-notify-hotfix"
          rm -rf "$ROOT"
          FILES=(
            "plugin/linkconnect/inc/email_notify.php"
            "plugin/linkconnect/merchant/api/notification_prefs.php"
          )
          for file in "${FILES[@]}"; do
            mkdir -p "$ROOT/$(dirname "$file")"
            cp "$file" "$ROOT/$file"
          done
          mkdir -p "$ROOT/plugin/onoff-builder-bridge/imports/linkconnect"
          rsync -a --exclude '._*' --exclude '.DS_Store' \
            plugin/onoff-builder-bridge/imports/linkconnect/ \
            "$ROOT/plugin/onoff-builder-bridge/imports/linkconnect/"
          find "$ROOT" -name '._*' -delete 2>/dev/null || true
          test -f "$ROOT/plugin/linkconnect/inc/email_notify.php"
          test -f "$ROOT/plugin/onoff-builder-bridge/imports/linkconnect/index.html"
          JS=$(grep -oE 'index-[A-Za-z0-9_-]+\.js' "$ROOT/plugin/onoff-builder-bridge/imports/linkconnect/index.html" | head -1)
          test -n "$JS"
          test -f "$ROOT/plugin/onoff-builder-bridge/imports/linkconnect/assets/$JS"
          bash scripts/assert-onoffcpa-spa-branding.sh --require-lock \
            "$ROOT/plugin/onoff-builder-bridge/imports/linkconnect/index.html"
          echo "SPA bundle: $JS"

      - name: FTP upload notify hotfix
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: .deploy/advertiser-notify-hotfix/
          server-dir: /public_html/
          state-name: onoffcpa-advertiser-notify-hotfix-v1
          dangerous-clean-slate: false
          log-level: standard
          timeout: 300000
