name: Hotfix SPA home

# TrendHub 홈 SPA + bridge 핵심 파일 FTP 업로드 및 HTTP 점검
on:
  workflow_dispatch:

jobs:
  upload-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assert TrendHub SPA branding
        run: bash scripts/assert-trendhub-spa-branding.sh --require-lock

      - name: Upload SPA and bridge essentials
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          missing=0
          [ -z "${FTP_SERVER:-}" ] && echo "::error::FTP_SERVER missing" && missing=1
          [ -z "${FTP_USERNAME:-}" ] && echo "::error::FTP_USERNAME missing" && missing=1
          [ -z "${FTP_PASSWORD:-}" ] && echo "::error::FTP_PASSWORD missing" && missing=1
          [ -z "${FTP_PORT:-}" ] && echo "::error::FTP_PORT missing" && missing=1
          [ "$missing" -eq 1 ] && exit 1

          upload_tree() {
            local local_root="$1"
            local remote_rel="$2"
            find "$local_root" -type f ! -name '._*' ! -name '.DS_Store' | while read -r f; do
              rel="${f#"$local_root"/}"
              url="ftp://${FTP_SERVER}:${FTP_PORT}/public_html/${remote_rel}/${rel}"
              echo "PUT ${remote_rel}/${rel}"
              curl --fail --silent --show-error --ftp-create-dirs \
                --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
                -T "$f" \
                "$url"
            done
          }

          upload_file() {
            local local_file="$1"
            local remote_rel="$2"
            test -f "$local_file"
            echo "PUT ${remote_rel}"
            curl --fail --silent --show-error --ftp-create-dirs \
              --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
              -T "$local_file" \
              "ftp://${FTP_SERVER}:${FTP_PORT}/public_html/${remote_rel}"
          }

          test -f plugin/onoff-builder-bridge/imports/linkconnect/index.html
          test -f plugin/onoff-builder-bridge/imports/linkconnect/spa-brand.trendhub
          test -f plugin/onoff-builder-bridge/imports/linkconnect/assets/index-DT8ou997.js

          # SPA bundle + static assets
          upload_tree "plugin/onoff-builder-bridge/imports/linkconnect" "plugin/onoff-builder-bridge/imports/linkconnect"

          # Bridge PHP needed to serve home
          upload_tree "plugin/onoff-builder-bridge/lib" "plugin/onoff-builder-bridge/lib"
          upload_file "plugin/onoff-builder-bridge/bootstrap.php" "plugin/onoff-builder-bridge/bootstrap.php"
          upload_file "plugin/onoff-builder-bridge/page.php" "plugin/onoff-builder-bridge/page.php"
          upload_file "index.php" "index.php"
          upload_file "inc/onoff-builder-home.php" "inc/onoff-builder-home.php"
          upload_file "_site.config.php" "_site.config.php"

          echo "=== remote SPA listing ==="
          curl --silent --show-error --list-only \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            "ftp://${FTP_SERVER}:${FTP_PORT}/public_html/plugin/onoff-builder-bridge/imports/linkconnect/" || true
          curl --silent --show-error --list-only \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            "ftp://${FTP_SERVER}:${FTP_PORT}/public_html/plugin/onoff-builder-bridge/imports/linkconnect/assets/" || true

      - name: Probe home and SPA assets over HTTP
        run: |
          set -euo pipefail
          BASE="https://trendhub.iwinv.net"
          fail=0

          probe() {
            local path="$1"
            local expect="$2"
            echo "GET ${path}"
            code=$(curl -sS -o /tmp/probe.body -w "%{http_code}" --connect-timeout 20 --max-time 60 "${BASE}${path}" || echo "000")
            echo "  status=${code}"
            if [ "$code" != "200" ]; then
              echo "::error::${path} returned ${code}"
              fail=1
              return
            fi
            if [ -n "$expect" ] && ! grep -q "$expect" /tmp/probe.body; then
              echo "::error::${path} missing expected content: ${expect}"
              head -c 400 /tmp/probe.body || true
              fail=1
            fi
          }

          probe "/" "index-DT8ou997.js"
          probe "/plugin/onoff-builder-bridge/imports/linkconnect/assets/index-DT8ou997.js" ""
          probe "/plugin/onoff-builder-bridge/imports/linkconnect/assets/index-DXX7FzVo.css" ""
          probe "/plugin/onoff-builder-bridge/imports/linkconnect/spa-brand.trendhub" "trendhub"
          probe "/bbs/login.php" "로그인"

          # Show home head snippet
          echo "=== home head ==="
          curl -sS --connect-timeout 20 --max-time 60 "${BASE}/" | head -n 40

          [ "$fail" -eq 0 ]
