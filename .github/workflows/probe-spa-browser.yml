name: Probe SPA browser render

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install playwright and render home
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install playwright-core@1.48.2 >/dev/null
          npx playwright install --with-deps chromium

          node <<'NODE'
          const { chromium } = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const errors = [];
            const failed = [];
            page.on('pageerror', (e) => errors.push(String(e)));
            page.on('console', (msg) => {
              if (msg.type() === 'error') errors.push('console:' + msg.text());
            });
            page.on('requestfailed', (req) => {
              failed.push(req.url() + ' :: ' + (req.failure() && req.failure().errorText));
            });

            const resp = await page.goto('https://trendhub.iwinv.net/', {
              waitUntil: 'networkidle',
              timeout: 90000,
            });
            console.log('HTTP', resp && resp.status());
            await page.waitForTimeout(3000);
            const html = await page.content();
            const rootHtml = await page.locator('#root').innerHTML().catch(() => 'NO_ROOT');
            const title = await page.title();
            const text = await page.locator('body').innerText().catch(() => '');
            console.log('TITLE', title);
            console.log('ROOT_LEN', rootHtml.length);
            console.log('ROOT_SNIP', rootHtml.slice(0, 500).replace(/\n/g, ' '));
            console.log('BODY_TEXT_SNIP', text.slice(0, 500).replace(/\n/g, ' | '));
            console.log('PAGE_ERRORS', JSON.stringify(errors.slice(0, 20), null, 2));
            console.log('FAILED_REQ', JSON.stringify(failed.slice(0, 30), null, 2));

            // headers for JS
            const js = await page.request.get('https://trendhub.iwinv.net/plugin/onoff-builder-bridge/imports/linkconnect/assets/index-DT8ou997.js');
            console.log('JS_STATUS', js.status(), 'JS_CT', js.headers()['content-type']);
            const css = await page.request.get('https://trendhub.iwinv.net/plugin/onoff-builder-bridge/imports/linkconnect/assets/index-DXX7FzVo.css');
            console.log('CSS_STATUS', css.status(), 'CSS_CT', css.headers()['content-type']);

            await browser.close();
            if (!rootHtml || rootHtml === 'NO_ROOT' || rootHtml.length < 50) {
              process.exit(2);
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
