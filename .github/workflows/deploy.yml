name: Deploy to Server

# 전체 FTP는 iwinv 공유호스팅에서 웹(443) 접속 거절을 유발할 수 있음.
# push 자동 실행 비활성 — 필요 시 Actions에서 수동 실행.
on:
  workflow_dispatch:

concurrency:
  group: trendhub-ftp-deploy
  cancel-in-progress: false

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean junk files before upload
        run: |
          find . -name '._*' -delete 2>/dev/null || true
          find . -name '.DS_Store' -delete 2>/dev/null || true

      - name: Assert TrendHub SPA branding
        run: bash scripts/assert-trendhub-spa-branding.sh --require-lock

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          parallel: 1
          protocol: ftp
          local-dir: ./
          server-dir: /public_html/
          state-name: trendhub-deploy-v1
          log-level: minimal
          timeout: 600000
          exclude: |
            **/.git*
            **/.github/**
            **/.DS_Store
            **/.vscode/**
            **/.idea/**
            **/._*
            _backup_transfer_*/
            **/_backup_transfer_*/
            _BUILDER_INPUT/**
            .deploy/**
            data/**
            cache/**
            session/**
            tmp/**
            node_modules/**
            **/node_modules/**
            *.log
            .env
            .env.*
            linkconnect-deploy-v*
            onoffcpa-deploy-v*
            trendhub-deploy-v*
            builder/**
            **/builder/**
            plugin/auto_comment/packages/**
            plugin/linkconnect/lib/tcpdf/fonts/**
            plugin/linkconnect/lib/tcpdf/tools/**
            **/tcpdf/fonts/**
            _test/**
            tests/**
            **/*.md
            **/README*
